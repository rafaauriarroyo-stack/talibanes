<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Talibanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Inter:wght@400;600;800&family=Pacifico&family=Permanent+Marker&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0f0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talibanes">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#0f0f12; --card:#1a1a20; --card2:#23232b; --line:#2e2e38;
  --txt:#f4f4f6; --mut:#9a9aa8; --lime:#c6ff3d; --pink:#ff3da5; --cyan:#3dd9ff; --red:#ff4d4d; --yellow:#ffd23d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:var(--txt)}
.app{max-width:640px;margin:0 auto;padding:0 14px 110px}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
.logo{font-family:Bangers,cursive;font-size:38px;letter-spacing:2px;line-height:1;color:var(--lime);text-shadow:3px 3px 0 var(--pink);transform:rotate(-2deg)}
.top .sp{flex:1}
.clock{font-size:12px;color:var(--mut);text-align:right;line-height:1.3}
.clock b{color:var(--yellow);font-size:14px}
.meav{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--lime)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(15,15,18,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;width:100%;max-width:640px}
.tabs button{flex:1;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);font-weight:600}
.tabs button .i{font-size:22px;filter:grayscale(1);opacity:.6}
.tabs button.on{color:var(--lime)}
.tabs button.on .i{filter:none;opacity:1}
.banner{background:#2a1f05;border:1px solid #5a4510;color:#ffe08a;border-radius:12px;padding:10px 12px;margin:6px 0 12px;font-size:13px}
.banner.red{background:#2a0b0b;border-color:#5a1a1a;color:#ffb3b3}
.hero{background:var(--card);border-radius:var(--r);padding:18px;margin:6px 0 14px;position:relative;overflow:hidden;border:1px solid var(--line)}
.hero.warn{background:linear-gradient(135deg,#2b0f1f,#1a1a20 60%);border-color:#5b1f3d}
.hero.ok{background:linear-gradient(135deg,#1d2a07,#1a1a20 60%);border-color:#3c5410}
.hero h2{font-family:Bangers,cursive;font-size:30px;letter-spacing:1px;margin:0 0 4px;font-weight:400}
.hero p{margin:0 0 14px;color:var(--mut)}
.hero .myimg{width:84px;height:84px;border-radius:14px;object-fit:cover;float:right;margin-left:12px;border:2px solid var(--lime);background:var(--card2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:800;background:var(--lime);color:#111;font-size:16px}
.btn.big{width:100%;padding:16px;font-size:18px}
.btn.pink{background:var(--pink);color:#fff}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;color:var(--mut)}
.bar{flex:1;height:8px;border-radius:8px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;font-size:11px;text-align:center}
.chip .av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--line)}
.chip.done .av{border-color:var(--lime)}
.chip.miss .av{border-color:var(--pink);filter:grayscale(.7)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.post{background:var(--card);border-radius:var(--r);margin:0 0 16px;overflow:hidden;border:1px solid var(--line)}
.post .hd{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post .hd img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.post .hd .nm{font-weight:800}
.post .hd .tm{color:var(--mut);font-size:12px}
.post .hd .sp{flex:1}
.ph{width:100%;display:block;background:var(--card2);min-height:200px;object-fit:contain}
.ph.ld{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.post .cap{padding:10px 12px 0;white-space:pre-wrap;word-wrap:break-word}
.reacts{display:flex;gap:6px;padding:10px 12px 12px;flex-wrap:wrap}
.reacts button{background:var(--card2);border-radius:20px;padding:5px 10px;font-size:15px;border:1px solid transparent}
.reacts button.on{border-color:var(--lime);background:#26300f}
.reacts button small{font-size:12px;margin-left:3px;color:var(--mut)}
.sec{font-family:Bangers,cursive;font-size:24px;letter-spacing:1px;margin:18px 0 10px;color:var(--txt);font-weight:400}
.sec small{font-family:Inter;font-size:12px;color:var(--mut);letter-spacing:0;margin-left:6px}
.empty{color:var(--mut);text-align:center;padding:28px 10px;background:var(--card);border-radius:var(--r);border:1px dashed var(--line)}
.day{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:12px;border:1px solid var(--line)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.day .dh b{text-transform:capitalize}
.day .dh span{font-size:12px;color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs .t{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card2)}
.thumbs .t img.ph{width:100%;height:100%;object-fit:cover;min-height:0}
.thumbs .t .who{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:10px 4px 3px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fails{margin-top:8px;font-size:13px;color:#ffb3cf}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.row img.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block}
.row .mid small{color:var(--mut)}
.row .cast{margin-top:4px;font-size:13px;color:var(--yellow)}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--card2);white-space:nowrap}
.tag.p{background:#3a1030;color:#ff9fd2}.tag.c{background:#1f3307;color:var(--lime)}.tag.f{background:#0b2a33;color:var(--cyan)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rank{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden}
.rank th,.rank td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
.rank th{font-size:12px;color:var(--mut);font-weight:600}
.rank td.n{text-align:left;display:flex;align-items:center;gap:8px;font-weight:700}
.rank td.n img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.listc{list-style:none;padding:0;margin:0}
.listc li{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card);border-radius:12px;margin-bottom:6px;font-size:14px}
.listc li span{flex:1}
.addrow{display:flex;gap:8px;margin-top:8px}
.inp{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;min-width:0}
.inp:focus{border-color:var(--lime)}
.x{width:30px;height:30px;border-radius:50%;background:var(--card2);color:var(--mut);font-size:14px;flex:none}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ccard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.ccard.on{border-color:var(--pink);background:linear-gradient(160deg,#3a1030,var(--card) 70%)}
.ccard .ce{font-size:30px}
.ccard .cn{font-family:Bangers,cursive;font-size:34px;line-height:1.05;color:var(--lime)}
.ccard .cl{font-size:12px;font-weight:700}
.ccard .cm{font-size:11px;color:var(--mut);margin-top:2px}
.ccard.add{border-style:dashed;color:var(--mut)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin:12px 0 0;gap:4px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt)}
select.inp{width:100%;appearance:none;-webkit-appearance:none}
input[type=date].inp{color-scheme:dark}
/* overlays */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:420px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.modal h3{font-family:Bangers,cursive;font-size:30px;letter-spacing:1px;margin:0 0 8px;font-weight:400;color:var(--lime)}
.modal p{color:var(--mut);margin:0 0 14px}
.modal .btns{display:flex;gap:8px;margin-top:14px}
.modal .btns .btn{flex:1}
.slot{font-family:Bangers,cursive;font-size:26px;letter-spacing:.5px;text-align:center;padding:22px 12px;border-radius:16px;background:#111;border:3px solid var(--yellow);color:var(--yellow);min-height:110px;display:flex;align-items:center;justify-content:center;margin:12px 0}
.slot.spin{animation:shake .12s infinite}
@keyframes shake{50%{transform:translateY(2px)}}
.lb{flex-direction:column;padding:0}
.lb img{max-width:100%;max-height:72vh;object-fit:contain}
.lb .info{width:100%;max-width:640px;padding:12px 16px}
.lb .close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);font-size:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:12px;font-weight:600;z-index:200;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
/* editor */
.ed{position:fixed;inset:0;z-index:90;background:#09090b;display:flex;flex-direction:column}
.ed .eh{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.ed .eh .t{flex:1;font-family:Bangers,cursive;font-size:24px;letter-spacing:1px;color:var(--lime)}
.ed .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;position:relative}
.ed canvas{max-width:100%;max-height:100%;touch-action:none;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6);background:#222}
.ed .pick{text-align:center;color:var(--mut)}
.ed .pick .btn{margin-top:14px}
.selbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(30,30,36,.95);padding:8px 10px;border-radius:14px;border:1px solid var(--line);font-size:12px;white-space:nowrap}
.selbar input[type=range]{width:90px;accent-color:var(--lime)}
.ed .tools{background:#141418;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.ttabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ttabs button{flex:1;padding:11px 10px;font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.ttabs button.on{color:var(--lime);box-shadow:inset 0 -2px var(--lime)}
.tpanel{padding:10px 12px;min-height:118px;max-height:34vh;overflow-y:auto}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.fbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut)}
.fbtn img{width:64px;height:64px;border-radius:12px;object-fit:cover;border:2px solid transparent}
.fbtn.on{color:var(--lime)}.fbtn.on img{border-color:var(--lime)}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.stk button{font-size:30px;padding:4px;border-radius:10px}
.stk button:active{background:var(--card2)}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #444}
.sw button.on{outline:3px solid var(--lime);outline-offset:2px}
.fonts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0}
.fonts button{flex:none;padding:6px 12px;border-radius:10px;background:var(--card2);font-size:17px}
.fonts button.on{background:var(--lime);color:#111}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{padding:5px 10px;border-radius:20px;background:var(--card2);font-size:12px;font-weight:700}
.lbl{font-size:12px;color:var(--mut);margin:0 0 6px}
.frames{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.frames button{flex:none;padding:10px 14px;border-radius:12px;background:var(--card2);font-weight:700;font-size:13px}
.frames button.on{background:var(--lime);color:#111}
.ed .foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.ed .foot .inp{padding:11px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-left:6px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo">TALIBANES</div>
    <div class="sp"></div>
    <div class="clock" id="clock"></div>
    <img class="meav" id="meav" alt="" style="display:none">
  </header>
  <div id="banners"></div>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script>
"use strict";
/* ---------------- helpers ---------------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v===false || v==null) continue;
    if (k==='class') el.className=v;
    else if (k==='style') el.style.cssText=v;
    else if (k==='text') el.textContent=v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true?'':v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; el.append(c instanceof Node?c:document.createTextNode(String(c))); }
  return el;
}
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return ymd(new Date()); }
function addDays(s,n){ const [y,m,d]=s.split('-').map(Number); return ymd(new Date(y,m-1,d+n)); }
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDay(s){
  const t=today();
  if (s===t) return 'Hoy';
  if (s===addDays(t,-1)) return 'Ayer';
  return parseD(s).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
}
function fmtShort(s){ return parseD(s).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtTime(ts){ return ts? new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : ''; }
function untilMidnight(){ const n=new Date(); const m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1); const mins=Math.max(0,Math.floor((m-n)/60000)); return Math.floor(mins/60)+'h '+String(mins%60).padStart(2,'0')+'m'; }
function hash(str){ let h=2166136261; for (let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
let toastT;
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=h('div',{class:'toast',text:msg}); document.body.append(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3200); }
function ask(title, text, okLabel='Sí', danger=false){
  return new Promise(res=>{
    const ov=h('div',{class:'ov'}, h('div',{class:'modal'},
      h('h3',{text:title}), h('p',{text:text}),
      h('div',{class:'btns'},
        h('button',{class:'btn ghost',text:'Cancelar',onclick:()=>{ov.remove();res(false);}}),
        h('button',{class:'btn'+(danger?' pink':''),text:okLabel,onclick:()=>{ov.remove();res(true);}}))));
    document.body.append(ov);
  });
}

/* ---------------- constants ---------------- */
const DEFAULT_CASTIGOS = [
  'Paga la primera ronda en la próxima quedada',
  'Foto de perfil elegida por el grupo durante 24 h',
  'Audio de 1 minuto cantando en el grupo',
  'Mañana sube la foto con la cara más fea posible',
  'Invita a cafés al próximo que lo pida',
  'Lleva la prenda más ridícula a la próxima quedada',
  'Sube una story con la foto que elija el grupo',
  'Hace de chófer en la próxima salida',
  '20 flexiones grabadas en vídeo',
  'Manda un piropo personalizado a cada uno del grupo',
  'Un día entero firmando cada mensaje con "perdón por fallar 🙏"',
  'Le toca organizar y reservar el próximo plan'
];
const DEFAULT_CONTADORES = [{k:'fiestas',e:'🎉',n:'Fiestas'},{k:'salidas',e:'🪩',n:'Salir de fiesta'},{k:'besos',e:'💋',n:'Besos'}];
const REACTS = ['🔥','😂','💀','👑','🤡','❤️'];
const STICKERS = ['🔥','😂','💀','👑','🍺','🍻','🎉','😎','🤡','💩','❤️','🥵','🫡','👀','🤙','🍕','⭐','💯','🐐','🌚','😈','🥳','🤯','😭','💪','🙏','✌️','🫶','☀️','🌈','⚡','💥','🎂','⚽','🏆','🎮','🍔','🌮','🍟','🍷','🥂','🚀','📸','💅','🧢','🕶️','🦄','🐸','💤','🤓','🥶','🤑','👻','🍆','🍑','💦','🌶️','🧠','🫠','🤌'];
const COLORS = ['#ffffff','#111111','#c6ff3d','#ff3da5','#3dd9ff','#ffd23d','#ff5a36','#8b5cff'];
const FONTS = ['Bangers','Permanent Marker','Pacifico','Anton','Inter'];
const FILTERS = [['none','Original'],['pop','Pop'],['calido','Cálido'],['frio','Frío'],['vintage','Vintage'],['sepia','Sepia'],['bn','B/N'],['noir','Noir'],['rosa','Rosita'],['acido','Ácido']];
const FRAMES = [['none','Sin marco'],['polaroid','Polaroid'],['banner','Banda TALIBANES'],['sello','Sello'],['neon','Neón'],['cine','Cine']];

/* ---------------- state ---------------- */
const S = {
  db:null, user:null, uid:null, owner:false, readOnly:false, offline:false,
  loaded:{members:false,posts:false}, slow:false,
  members:{}, posts:{}, castigos:{}, config:null, profiles:{}, eventos:{},
  cntSel:'fiestas', cntRange:'mes', cntFor:null,
  imgCache:new Map(), tab:'hoy', joinShown:false, lastDay:today()
};
function memberIds(){ return Object.keys(S.members).sort((a,b)=>(S.members[a].joinedAt||0)-(S.members[b].joinedAt||0)); }
Object.defineProperty(S,'owner',{get(){ return !!(S.uid && S.config && S.config.admin===S.uid); }});
function nameOf(uid){ return (S.members[uid]&&S.members[uid].apodo) || 'Alguien'; }
function initialsAvatar(uid){
  const n = nameOf(uid); const hue = hash(uid||'x')%360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="hsl(${hue},70%,45%)"/><text x="40" y="52" font-family="Arial" font-weight="bold" font-size="34" fill="#fff" text-anchor="middle">${(n[0]||'?').toUpperCase().replace(/[<&>"]/g,'')}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function avatarOf(uid){

/* write wrapper */
async function W(fn){
  try { await fn(); return true; }
  catch(e){
    const c = e && e.code;
    if (c==='unavailable'){ await sleep(700+Math.random()*800); try{ await fn(); return true; }catch(e2){ toast('Problema de conexión, inténtalo otra vez'); return false; } }
    if (c==='permission-denied'){ toast('Sin permiso para guardar. Recarga la app.'); return false; }
    if (c==='not-found'){ toast('Eso ya no existe. Recarga.'); return false; }
    if (c==='resource-exhausted'){ toast('Límite gratuito del día alcanzado o vas muy rápido. Prueba más tarde.'); return false; }
    toast('Error: '+((e&&e.message)||c||'desconocido')); return false;
  }
}

/* ---------------- computations ---------------- */
function missedList(){
  const t=today(), y=addDays(t,-1), min=addDays(t,-120), out=[];
  for (const uid of memberIds()){
    const m=S.members[uid]; let d=addDays(m.joined||t,1); if (d<min) d=min;
    for (let x=d; x<=y; x=addDays(x,1)) if (!S.posts[pid(x,uid)]) out.push({date:x,uid});
  }
  return out.sort((a,b)=> b.date.localeCompare(a.date) || nameOf(a.uid).localeCompare(nameOf(b.uid)));
}
function streak(uid){ let d=today(); if (!S.posts[pid(d,uid)]) d=addDays(d,-1); let n=0; while (S.posts[pid(d,uid)]){ n++; d=addDays(d,-1); } return n; }
function bestStreak(uid){
  const ds=Object.values(S.posts).filter(p=>p.uid===uid).map(p=>p.date).sort(); let best=0,cur=0,prev=null;
  for (const d of ds){ cur = (prev && addDays(prev,1)===d) ? cur+1 : 1; best=Math.max(best,cur); prev=d; } return best;
}

/* ---------------- image loading ---------------- */
let io=null;
function imgFor(id, post, cls='ph'){
  const key = id+'@'+(post.ts||0);
  const im = h('img',{class:cls,alt:''});
  if (S.imgCache.has(key)){ im.src=S.imgCache.get(key); return im; }
  im.classList.add('ld'); im.dataset.key=key; im.dataset.id=id;
  if (!io) io = new IntersectionObserver(ents=>{ for (const e of ents) if (e.isIntersecting){ io.unobserve(e.target); fetchImg(e.target); } },{rootMargin:'300px'});
  io.observe(im);
  return im;
}
const inflight=new Map();
async function fetchImg(im){
  const key=im.dataset.key, id=im.dataset.id;
  if (S.imgCache.has(key)){ im.src=S.imgCache.get(key); im.classList.remove('ld'); return; }
  if (!S.db) return;
  let p = inflight.get(key);
  if (!p){ p = S.db.doc('imgs/'+id).get().then(s=> s.exists ? (s.data().data||'') : '').catch(()=> ''); inflight.set(key,p); }
  const data = await p; inflight.delete(key);
  if (data){ S.imgCache.set(key,data); im.src=data; }
  im.classList.remove('ld');
}

  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('talibanes:'+mid+':'+pin));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* Lee la fecha EXIF (DateTimeOriginal) de un JPEG, si la tiene */
async function exifDate(f){
  try{
    const buf=await f.slice(0,256*1024).arrayBuffer(); const v=new DataView(buf);
    if (v.byteLength<4 || v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while (o+10<v.byteLength){
      const mk=v.getUint16(o), len=v.getUint16(o+2);
      if (mk===0xFFE1 && v.getUint32(o+4)===0x45786966){
        const t=o+10, le=v.getUint16(t)===0x4949;
        const g16=p=>v.getUint16(p,le), g32=p=>v.getUint32(p,le);
        const ifd=off=>{ const n=g16(t+off), tags={}; for (let i=0;i<n;i++){ const e=t+off+2+i*12; if (e+12>v.byteLength) break; tags[g16(e)]={count:g32(e+4),val:e+8}; } return tags; };
        const ascii=tg=>{ const p=tg.count>4? t+g32(tg.val) : tg.val; let s=''; for (let i=0;i<tg.count-1 && p+i<v.byteLength;i++) s+=String.fromCharCode(v.getUint8(p+i)); return s; };
        const i0=ifd(g32(t+4)); let ds=null;
        if (i0[0x8769]){ const ex=ifd(g32(i0[0x8769].val)); if (ex[0x9003]) ds=ascii(ex[0x9003]); }
        if (!ds && i0[0x0132]) ds=ascii(i0[0x0132]);
        const m=ds && ds.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/); if (!m) return null;
        return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();
      }
      if ((mk&0xFF00)!==0xFF00 || mk===0xFFDA) break;
      o+=2+len;
    }
  }catch(_){}
  return null;
}
async function photoAgeMin(f){
  const ages=[]; const ex=await exifDate(f);
  if (ex) ages.push((Date.now()-ex)/60000);
  if (f.lastModified) ages.push((Date.now()-f.lastModified)/60000);
  return ages.length? Math.max(...ages) : null;
}
async function loadFile(f, mode){

  }

}
function filterPixels(d, name){
  if (name==='none') return;
  const n=d.length;
  for (let i=0;i<n;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2]; const l=0.299*r+0.587*g+0.114*b;
    switch(name){
      case 'bn': r=g=b=l; break;
      case 'noir': { const v=(l-128)*1.6+118; r=g=b=v; break; }
      case 'sepia': { const nr=r*.393+g*.769+b*.189, ng=r*.349+g*.686+b*.168, nb=r*.272+g*.534+b*.131; r=nr; g=ng; b=nb; break; }
      case 'vintage': { r=l+(r-l)*.55; g=l+(g-l)*.55; b=l+(b-l)*.55; r=r*.85+45; g=g*.85+30; b=b*.7+35; break; }
      case 'pop': { r=l+(r-l)*1.7; g=l+(g-l)*1.7; b=l+(b-l)*1.7; r=(r-128)*1.15+128; g=(g-128)*1.15+128; b=(b-128)*1.15+128; break; }
      case 'frio': r=r*.88; g=g*.98+6; b=b*1.08+28; break;
      case 'calido': r=r*1.06+24; g=g*1.01+10; b=b*.82; break;
      case 'rosa': r=r*.95+45; g=g*.85+10; b=b*.95+40; break;
      case 'acido': { const nr=255-b, ng=g*1.2, nb=255-r; r=l+(nr-l)*1.4; g=l+(ng-l)*1.4; b=l+(nb-l)*1.4; break; }
    }
    d[i]=r; d[i+1]=g; d[i+2]=b;
  }
}

  if (name==='vintage'||name==='noir') vignette(x,w,hh,name==='noir'?.6:.45);

}

    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`${R*.42}px Bangers, cursive`; ctx.fillText('TALIBANES',0,-R*.12);

    const m=u*.03; ctx.lineWidth=u*.012; ctx.shadowBlur=u*.04;
    ctx.strokeStyle='#ff3da5'; ctx.shadowColor='#ff3da5'; ctx.strokeRect(m,m,w-2*m,hh-2*m);
    ctx.strokeStyle='#c6ff3d'; ctx.shadowColor='#c6ff3d'; ctx.strokeRect(m*1.9,m*1.9,w-3.8*m,hh-3.8*m);

function compose(ctx, sel){
  ctx.clearRect(0,0,E.W,E.H); ctx.drawImage(E.base,0,0);
  for (const s of E.strokes) drawStroke(ctx,s);
  for (const o of E.objs) drawObj(ctx,o);
  drawFrame(ctx,E.W,E.H,E.frame);
  if (sel>=0 && E.objs[sel]){
    const o=E.objs[sel]; const b=objBox(ctx,o); ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.r||0);
    ctx.setLineDash([12,8]); ctx.lineWidth=Math.max(3,E.W/300); ctx.strokeStyle='#c6ff3d'; ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore();
  }
}
function redraw(){ if (E.cv && E.base) compose(E.ctx, E.sel); }
function hit(p){
  for (let i=E.objs.length-1;i>=0;i--){ const o=E.objs[i]; const b=objBox(E.ctx,o); const dx=p.x-o.x, dy=p.y-o.y, c=Math.cos(-(o.r||0)), s=Math.sin(-(o.r||0));
    const lx=dx*c-dy*s, ly=dx*s+dy*c; const pad=E.W*.02; if (Math.abs(lx)<b.w/2+pad && Math.abs(ly)<b.h/2+pad) return i; }
  return -1;
}
function toC(e){ const r=E.cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*E.W/r.width, y:(e.clientY-r.top)*E.H/r.height}; }
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
function bindCanvas(cv){
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){}
    const p=toC(e); E.ptrs.set(e.pointerId,p);
    if (E.mode==='draw'){ if (E.ptrs.size===1){ E.cur={c:E.brush.color,w:E.brush.size*E.W/700,p:[[p.x,p.y]]}; E.strokes.push(E.cur); redraw(); } return; }
    if (E.ptrs.size===1){ const i=hit(p); E.sel=i; E.moved=false; if (i>=0){ const o=E.objs[i]; E.drag={dx:p.x-o.x,dy:p.y-o.y}; E.objs.push(E.objs.splice(i,1)[0]); E.sel=E.objs.length-1; } else E.drag=null; renderSelBar(); }
    else if (E.ptrs.size===2 && E.sel>=0){ const [a,b]=[...E.ptrs.values()]; const o=E.objs[E.sel]; E.pinch={d:dist(a,b),a:ang(a,b),s:o.s,r:o.r||0}; E.drag=null; }

    const o=E.objs[E.sel]; if (!o) return;
    if (E.pinch && E.ptrs.size>=2){ const [a,b]=[...E.ptrs.values()]; o.s=Math.max(12,Math.min(E.W*1.5,E.pinch.s*dist(a,b)/E.pinch.d)); o.r=E.pinch.r+ang(a,b)-E.pinch.a; E.moved=true; redraw(); syncSel(); }
    else if (E.drag){ o.x=p.x-E.drag.dx; o.y=p.y-E.drag.dy; E.moved=true; redraw(); }
  });
  const up=e=>{
    if (!E.ptrs.has(e.pointerId)) return; E.ptrs.delete(e.pointerId);
    if (E.mode==='draw'){ if (E.cur && E.ptrs.size===0){ E.cur=null; pushHist(); } return; }
    if (E.ptrs.size<2) E.pinch=null;
    if (E.ptrs.size===1 && E.sel>=0){ const p=[...E.ptrs.values()][0]; const o=E.objs[E.sel]; E.drag={dx:p.x-o.x,dy:p.y-o.y}; }
    if (E.ptrs.size===0){ E.drag=null; if (E.moved){ pushHist(); E.moved=false; } }

function addObj(o){ E.mode='move'; E.objs.push(o); E.sel=E.objs.length-1; pushHist(); redraw(); renderSelBar(); renderToolsOnly(); }
function addSticker(em){ addObj({t:'e',text:em,x:E.W/2+(Math.random()-.5)*E.W*.2,y:E.H/2+(Math.random()-.5)*E.H*.2,s:Math.min(E.W,E.H)*.18,r:(Math.random()-.5)*.4}); }
function addText(txt){ if (!txt.trim()) return; addObj({t:'t',text:txt.trim(),x:E.W/2,y:E.H*.18+Math.random()*E.H*.1,s:Math.min(E.W,E.H)*.11,r:0,font:E.txt.font,color:E.txt.color,outline:E.txt.outline}); }
function renderSelBar(){
  if (!E.ov) return; const old=E.ov.querySelector('.selbar'); if (old) old.remove();
  const o=E.objs[E.sel]; if (!o || E.mode==='draw') return;
  const size=h('input',{type:'range',min:'12',max:String(Math.round(E.W*1.2)),value:String(Math.round(o.s))});
  const rot=h('input',{type:'range',min:'-180',max:'180',value:String(Math.round((o.r||0)*180/Math.PI))});
  size.oninput=()=>{ o.s=+size.value; redraw(); }; rot.oninput=()=>{ o.r=+rot.value*Math.PI/180; redraw(); };
  size.onchange=rot.onchange=pushHist;
  const bar=h('div',{class:'selbar'}, '↔', size, '⟳', rot,
    o.t==='t'? h('button',{class:'x',title:'Editar texto',text:'✏️',onclick:()=>{ const inp=h('textarea',{class:'inp',rows:'2'}); inp.value=o.text;
      const ov=h('div',{class:'ov'}, h('div',{class:'modal'}, h('h3',{text:'Editar texto'}), inp, h('div',{class:'btns'}, h('button',{class:'btn ghost',text:'Cancelar',onclick:()=>ov.remove()}), h('button',{class:'btn',text:'OK',onclick:()=>{ if(inp.value.trim()){ o.text=inp.value.trim(); pushHist(); redraw(); } ov.remove(); }}))));
      document.body.append(ov); }}) : null,
    h('button',{class:'x',title:'Borrar',text:'🗑',onclick:()=>{ E.objs.splice(E.sel,1); E.sel=-1; pushHist(); redraw(); renderSelBar(); }}));
  bar.sync=()=>{ size.value=String(Math.round(o.s)); rot.value=String(Math.round(((o.r||0)*180/Math.PI+540)%360-180)); };
  E.ov.querySelector('.stage').append(bar);
}
function syncSel(){ const b=E.ov&&E.ov.querySelector('.selbar'); if (b&&b.sync) b.sync(); }

function renderEditor(){
  const ov=E.ov; if (!ov) return; ov.textContent='';
  ov.append(h('div',{class:'eh'},
    h('button',{class:'btn ghost sm',onclick:async()=>{ if (!E.img || await ask('¿Salir?','Perderás la edición.','Salir',true)) closeEditor(); }},'✕'),
    h('div',{class:'t',text:'Foto del día'}),
    E.img? h('button',{class:'btn ghost sm',onclick:undo},'↶') : null,
    E.img? h('button',{class:'btn ghost sm',onclick:()=>pickFile('env')},'📷 Repetir') : null));
  const stage=h('div',{class:'stage'}); ov.append(stage);
  if (!E.img){
    stage.append(h('div',{class:'pick'}, h('div',{style:'font-size:64px',text:'📸'}),
      h('div',{style:'font-weight:800;color:var(--txt);font-size:18px',text:'Haz la foto ahora'}),
      h('div',{style:'margin-top:4px',text:'Nada de fotos antiguas: se comprueba la hora de la foto.'}), h('br'),
      h('div',{style:'display:flex;gap:10px;justify-content:center;flex-wrap:wrap'},
        h('button',{class:'btn',onclick:()=>pickFile('env')},'📷 Cámara'),
        h('button',{class:'btn ghost',onclick:()=>pickFile('user')},'🤳 Selfie')),
      galeriaOK()? h('button',{class:'btn ghost sm',style:'margin-top:14px',onclick:()=>pickFile('gal')},'🖼️ Subir de la galería')
               : h('div',{style:'font-size:12px;margin-top:16px',text:'En ordenador se abre el selector de archivos: solo vale una foto hecha hace menos de 15 min.'})));
    E.cv=null; return;
  }
  E.cv=h('canvas'); E.cv.width=E.W; E.cv.height=E.H; E.ctx=E.cv.getContext('2d'); bindCanvas(E.cv); stage.append(E.cv);
  redraw();
  const tools=h('div',{class:'tools'}); ov.append(tools);
  E.toolsEl=tools; renderToolsOnly();
  const cap=h('input',{class:'inp',placeholder:'Escribe algo (opcional)…',maxlength:'200',value:E.cap});
  cap.oninput=()=>{E.cap=cap.value;};
  const pub=h('button',{class:'btn pink',onclick:()=>publish(pub)},'Publicar 🚀');
  if (S.offline || !canAct()) { pub.disabled=true; pub.title='Sin conexión con la base de datos'; }
  ov.append(h('div',{class:'foot'}, cap, pub));
  renderSelBar();
}
function renderToolsOnly(){
  const tools=E.toolsEl; if (!tools) return; tools.textContent='';
  const tabs=[['filtros','🎨 Filtros'],['stickers','😎 Stickers'],['texto','🔤 Texto'],['dibujar','✏️ Dibujar'],['marcos','🖼️ Marcos']];
  tools.append(h('div',{class:'ttabs'}, tabs.map(([k,l])=>h('button',{class:E.tool===k?'on':'',onclick:()=>{ E.tool=k; E.mode = k==='dibujar'?'draw':'move'; if(E.mode==='draw') E.sel=-1; redraw(); renderSelBar(); renderToolsOnly(); }},l))));
  const p=h('div',{class:'tpanel'}); tools.append(p);
  if (E.tool==='filtros'){
    if (!E.thumbSrc || E.thumbFor!==E.img){ const s=72/Math.min(E.W,E.H); E.thumbSrc=filtered(E.img,Math.round(E.W*s),Math.round(E.H*s),'none'); E.thumbFor=E.img; E.thumbs={}; }
    p.append(h('div',{class:'hscroll'}, FILTERS.map(([k,l])=>{
      if (!E.thumbs[k]) E.thumbs[k]=filtered(E.thumbSrc,E.thumbSrc.width,E.thumbSrc.height,k).toDataURL('image/jpeg',.7);
      return h('button',{class:'fbtn'+(E.filter===k?' on':''),onclick:()=>{ E.filter=k; applyFilter(); pushHist(); redraw(); renderToolsOnly(); }}, h('img',{src:E.thumbs[k],alt:''}), l);
    })));
  } else if (E.tool==='stickers'){
    p.append(h('div',{class:'stk'}, STICKERS.map(s=>h('button',{onclick:()=>addSticker(s)},s))));
    p.append(h('div',{class:'lbl',style:'margin-top:8px',text:'Toca un sticker para moverlo. Con dos dedos: zoom y girar.'}));
  } else if (E.tool==='texto'){
    const inp=h('input',{class:'inp',placeholder:'Escribe tu texto…',maxlength:'60'});
    const add=()=>{ addText(inp.value); inp.value=''; };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') add(); });
    p.append(h('div',{class:'addrow',style:'margin-top:0'}, inp, h('button',{class:'btn',onclick:add},'Añadir')));
    p.append(h('div',{class:'fonts'}, FONTS.map(f=>h('button',{class:E.txt.font===f?'on':'',style:`font-family:"${f}"`,onclick:()=>{ E.txt.font=f; const o=E.objs[E.sel]; if(o&&o.t==='t'){o.font=f;pushHist();redraw();} renderToolsOnly(); }},f==='Inter'?'Normal':f))));
    const ol=h('input',{type:'checkbox'}); ol.checked=E.txt.outline; ol.onchange=()=>{ E.txt.outline=ol.checked; const o=E.objs[E.sel]; if(o&&o.t==='t'){o.outline=ol.checked;pushHist();redraw();} };
    p.append(h('div',{class:'sw'}, COLORS.map(c=>h('button',{class:E.txt.color===c?'on':'',style:`background:${c}`,onclick:()=>{ E.txt.color=c; const o=E.objs[E.sel]; if(o&&o.t==='t'){o.color=c;pushHist();redraw();} renderToolsOnly(); }})), h('label',{class:'toggle'}, ol, 'Borde')));
    const t=today(); const n = S.uid ? Object.values(S.posts).filter(x=>x.uid===S.uid).length+ (S.posts[pid(t,S.uid)]?0:1) : 1;
    p.append(h('div',{class:'quick'}, ['TALIBANES','BUENOS DÍAS','DÍA '+n, 'OTRO DÍA MÁS', 'SIN FILTRO', 'MODO BESTIA', new Date().toLocaleDateString('es-ES',{weekday:'long'}).toUpperCase()+' 💀'].map(q=>h('button',{onclick:()=>addText(q)},q))));
  } else if (E.tool==='dibujar'){
    p.append(h('div',{class:'lbl',text:'Dibuja con el dedo sobre la foto'}));
    p.append(h('div',{class:'sw'}, COLORS.map(c=>h('button',{class:E.brush.color===c?'on':'',style:`background:${c}`,onclick:()=>{ E.brush.color=c; renderToolsOnly(); }}))));
    const r=h('input',{type:'range',min:'4',max:'60',value:String(E.brush.size),style:'width:100%;accent-color:var(--lime);margin-top:10px'}); r.oninput=()=>{E.brush.size=+r.value;};
    p.append(h('div',{class:'lbl',style:'margin-top:10px',text:'Grosor'}), r);
    if (E.strokes.length) p.append(h('button',{class:'btn ghost sm',style:'margin-top:6px',onclick:()=>{ E.strokes=[]; pushHist(); redraw(); renderToolsOnly(); }},'Borrar dibujo'));
  } else if (E.tool==='marcos'){

  }
}
function exportData(){
  let w=E.W, hh=E.H; const c=document.createElement('canvas'); c.width=w; c.height=hh; const x=c.getContext('2d');
  const save=E.ctx; E.ctx=x; compose(x,-1); E.ctx=save;
  let scale=Math.min(1,1080/Math.max(w,hh)), q=.86, out='';
  for (let tries=0; tries<12; tries++){
    const cw=Math.round(w*scale), ch=Math.round(hh*scale); const c2=document.createElement('canvas'); c2.width=cw; c2.height=ch; c2.getContext('2d').drawImage(c,0,0,cw,ch);
    out=c2.toDataURL('image/jpeg',q);
    if (out.length<235000) return out;
    if (q>.55) q-=.1; else scale*=.85;

  return out;
}
async function publish(btn){
  if (!canAct()) return toast('No puedes publicar desde aquí');
  E.sel=-1; redraw();
  btn.disabled=true; btn.textContent='Subiendo…';
  const data=exportData(); const t=today(); const id=pid(t,S.uid); const ts=Date.now();
  S.imgCache.set(id+'@'+ts, data);
  const ok = await W(()=>S.db.doc('imgs/'+id).set({data,uid:S.uid,date:t,ts}))
          && await W(()=>S.db.doc('posts/'+id).set({uid:S.uid,date:t,caption:(E.cap||'').trim().slice(0,200),ts,r:{},live:!!E.live}));
  if (ok){ closeEditor(); S.tab='hoy'; renderAll(); toast('¡Foto subida! Hoy te libras 😎'); }
  else { btn.disabled=false; btn.textContent='Publicar 🚀'; }
}

/* ---------------- boot ---------------- */
setInterval(()=>{ renderClock(); if (today()!==S.lastDay){ S.lastDay=today(); renderAll(); } }, 20000);
renderAll();
(async function boot(){
  let db=null;
  try {
    if (!window.firebase || !window.FIREBASE_CONFIG) throw new Error('sin firebase');
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    db = firebase.firestore();
  } catch(e){ console.error(e); S.offline=true; renderAll(); return; }
  S.db=db;
  try { S.uid = localStorage.getItem('tb_mid') || null; } catch(_){}
  const timer=setTimeout(()=>{ S.slow=true; renderBanners(); },10000);
  const onErr = e => { clearTimeout(timer); console.error(e); if (e && e.code==='permission-denied') S.offline=true; renderAll(); };
  db.collection('members').onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); S.members=m;
    if (!snap.metadata.fromCache){ S.loaded.members=true; clearTimeout(timer); }
    renderAll();
    if (S.loaded.members && !iAmMember() && !S.joinShown){ S.joinShown=true; showJoin(); }
  }, onErr);
  db.collection('posts').onSnapshot(snap=>{
    const p={}; snap.docs.forEach(d=>{ p[d.id]=d.data(); }); S.posts=p;
    if (!snap.metadata.fromCache){ S.loaded.posts=true; clearTimeout(timer); S.slow=false; }
    renderAll();
  }, onErr);
  db.collection('eventos').onSnapshot(snap=>{ const ev={}; snap.docs.forEach(d=>{ ev[d.id]=d.data(); }); S.eventos=ev; if (S.tab==='cnt'||S.tab==='rank') renderAll(); }, onErr);
  db.collection('castigos').onSnapshot(snap=>{ const c={}; snap.docs.forEach(d=>{ c[d.id]=d.data(); }); S.castigos=c; renderAll(); }, onErr);
  db.doc('config/main').onSnapshot(s=>{ S.config = s.exists ? s.data() : null; renderAll(); }, onErr);
})();
</script>
